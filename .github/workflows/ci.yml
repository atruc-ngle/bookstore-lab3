name: ci
on:
  push:
    branches: ['**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build và chạy kiểm thử
        run: ./mvnw -B verify
